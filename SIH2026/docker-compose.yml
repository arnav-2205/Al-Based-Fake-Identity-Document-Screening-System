services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-screening}
      POSTGRES_USER: ${POSTGRES_USER:-screening}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-screening_pw}
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-screening}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/${MINIO_BUCKET:-documents};
      exit 0;
      "

  ai-service:
    build:
      context: .
      dockerfile: ./ai-service/Dockerfile
    environment:
      AI_USE_REAL_MODELS: ${AI_USE_REAL_MODELS:-false}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health'); "]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-screening}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-screening}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-screening_pw}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-64-char-random-string-0123456789abcdef0123456789abcd}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      FABRIC_ENABLED: ${FABRIC_ENABLED:-false}
    ports: ["8082:8080"]

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports: ["8081:80"]

volumes:
  pg-data:
  minio-data: